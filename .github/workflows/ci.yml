name: ci

# No branch or path filter: a filtered-out run would leave the required check "ci" pending forever.
# "edited" is here because a pull request's title becomes part of the commit on main.
# No manual trigger: a manual run on the same commit could report "ci" without checking the commits.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# What is checked stands in scripts and not here, because agents may not change a workflow file.
jobs:
  # This job can print lines of the page, so it waits until no private term is in it.
  page:
    needs: blocked-terms
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover --start-directory .github/scripts
      - run: python3 .github/scripts/check_page.py

  blocked-terms:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      attempt: ${{ github.run_attempt }}
    steps:
      # The check is the one of cloud-labs, at a commit that was approved there, so a pull request here cannot change what
      # reads the terms. It is put aside before the pull request is there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oplf-svg/cloud-labs
          ref: 30c47d7b0aa2419939ef8d2f206aa90f00ee01e2
          persist-credentials: false
      - run: cp .github/scripts/blocked_terms.py "$RUNNER_TEMP/blocked_terms.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Asked for again on every run, because a re-run replays the title it first saw.
      - name: Get the current title and description
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" > "$RUNNER_TEMP/pull.json"
      - name: Look for private terms
        env:
          BLOCKED_TERMS: ${{ secrets.BLOCKED_TERMS }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_FILE: ${{ runner.temp }}/pull.json
        # -I: nothing is imported from the folder of the pull request.
        run: python3 -I "$RUNNER_TEMP/blocked_terms.py"

  # The required check. It runs even when a job above fails or is skipped, because GitHub counts a skipped required check as
  # passed. After a failure, re-run all jobs: "failed jobs only" would reuse a blocked-terms result from before the title was
  # edited, so it fails here.
  ci:
    if: ${{ always() }}
    needs: [blocked-terms, page]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          jq --raw-output 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          jq --exit-status --arg attempt "$ATTEMPT" '
            length == 2
            and all(.[]; .result == "success")
            and ."blocked-terms".outputs.attempt == $attempt
          ' <<< "$RESULTS" > /dev/null
